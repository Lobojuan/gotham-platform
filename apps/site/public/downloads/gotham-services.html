<script>
(()=>{
 const copy=JSON.parse(document.querySelector('#copy').textContent),get=id=>document.getElementById(id);
 let lang='en',page=0,started=false;
 try{lang=localStorage.getItem('gc-language')||'en';}catch{}
 const requested=new URLSearchParams(location.search).get('lang');if(copy[requested])lang=requested;if(!copy[lang])lang='en';
 function title(n){const c=copy[lang];return n===0?c.cover.replace('\n',' '):n===4?c.scan:c.titles[n-1];}
 function show(){
   const c=copy[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';get('language').value=get('present-language').value=lang;
   get('heading').textContent=c.cover.replace('\n',' ');get('help').textContent=c.help;get('start').textContent=c.start;
   for(const name of ['prev','next','full'])get(name).textContent=name==='prev'?c.previous:name==='next'?c.next:document.fullscreenElement?c.exit:c.fullscreen;
   for(const ext of ['pdf','pptx'])for(const prefix of ['','viewer-']){get(prefix+ext).href=`gotham-services-${lang}.${ext}`;get(prefix+ext).setAttribute('aria-label',`${c.download} ${ext==='pdf'?'PDF':'PowerPoint'}`);}
   get('count').textContent=`${page+1} / 5`;get('prev').disabled=page===0;get('next').disabled=page===4;
   get('slide').alt=[title(page),...(page>0&&page<4?c.services[page-1]:page===4?[c.website,'gothamconsult.com',c.follow,'Gotham Consult']:[])].join('. ');
   get('error').hidden=true;get('slide').src=`gotham-services/${lang}/slide-${page+1}.webp`;
   // Preload the next slide. No provider or private account is needed to present.
   if(page<4){const i=new Image();i.src=`gotham-services/${lang}/slide-${page+2}.webp`;}
 }
 function choose(value){lang=value;try{localStorage.setItem('gc-language',lang);}catch{}show();}
 function move(n){if(!started)return;page=Math.max(0,Math.min(4,page+n));show();}
 get('language').onchange=e=>choose(e.target.value);get('present-language').onchange=e=>choose(e.target.value);
 get('start').onclick=()=>{started=true;get('intro').hidden=true;get('viewer').hidden=false;get('next').focus();show();};
 get('prev').onclick=()=>move(-1);get('next').onclick=()=>move(1);
 get('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.body.requestFullscreen)await document.body.requestFullscreen();}catch{}show();};
 document.addEventListener('fullscreenchange',show);
 document.addEventListener('keydown',e=>{if(!started||/SELECT|INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(-1);}if(e.key==='Home'){page=0;show();}if(e.key==='End'){page=4;show();}});
 get('slide').onerror=()=>{get('error').hidden=false;get('error').textContent=({en:'Slide unavailable. Download the PDF.',fr:'Diapositive indisponible. Téléchargez le PDF.',es:'Diapositiva no disponible. Descarga el PDF.',de:'Folie nicht verfügbar. Laden Sie das PDF herunter.',ar:'الشريحة غير متاحة. نزّلوا ملف PDF.',zh:'幻灯片暂不可用，请下载 PDF。'})[lang];};
 choose(lang);
})();
</script></body></html>
