services:
  crm:
    build: .
    restart: unless-stopped
    environment:
      PORT: "4100"
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      PUBLIC_URL: ${PUBLIC_URL:-https://gothamconsult.com}
      SITE_URL: ${SITE_URL:-https://gothamconsult.com}
      MEDIA_URL: ${MEDIA_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Gotham Consult <info@gothamconsult.com>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-info@gothamconsult.com}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_HOURLY_LIMIT: ${MAIL_HOURLY_LIMIT:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-}
      ARKESEL_API_KEY: ${ARKESEL_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-GOTHAM}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      REDIRECT_HOSTS: ${REDIRECT_HOSTS:-}
      PROXY_KEY: ${PROXY_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_REASONING: ${OPENAI_REASONING:-}
      ASK_DAILY_CAP: ${ASK_DAILY_CAP:-400}
      MEDIA_DIR: /data/media
      SITE_DIR: /data/site
    volumes:
      - gotham_media:/data/media
      - /srv/gotham-site:/data/site:ro
    expose: ["4100"]
    networks:
      oracle_default:
        aliases: [gotham-crm]
volumes:
  gotham_media:
networks:
  oracle_default:
    external: true
