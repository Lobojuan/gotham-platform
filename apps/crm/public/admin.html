<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gotham CRM</title>
<link rel="icon" type="image/png" sizes="64x64" href="/admin/brand/icon-64.png"><link rel="apple-touch-icon" href="/admin/brand/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--paper:#FAFAF8;--surface:#fff;--sunk:#F2F2EE;--ink:#0F1B2D;--mute:#5A6472;--line:#E2E4E7;--gold:#A9761F;--gold-soft:#F4EAD7;--green:#1F6B4E;--green-soft:#E1EFE8;--red:#A1322B;--red-soft:#F7E7E5;--wa:#1FA855}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}button,input,select,textarea{font:inherit;color:inherit}
.kente{height:5px;background:repeating-linear-gradient(90deg,#A9761F 0 28px,#0F1B2D 28px 40px,#1F6B4E 40px 64px,#C9A24B 64px 76px)}
.btn{border-radius:999px;padding:9px 16px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;gap:7px;align-items:center;text-decoration:none}
.btn-dark{background:var(--ink);color:#fff}.btn-line{background:#fff;border-color:var(--line)}.btn-green{background:var(--green);color:#fff}.btn-wa{background:var(--wa);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:none}
input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,27,45,.07)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;width:min(400px,100%);box-shadow:0 18px 50px rgba(15,27,45,.08)}
.mark{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.mark img{width:56%;height:auto;display:block}
.lcard label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}
.err{color:var(--red);font-size:13.5px;min-height:1.2em;margin-top:10px}
/* components */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi b{display:block;font-size:26px}.kpi span{font-size:13px;color:var(--mute)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input.t,.filters select.t{width:auto;min-width:150px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer}tr.r:hover td{background:#FBFCFD}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;display:inline-block;white-space:nowrap}
.t-paid{background:var(--green-soft);color:var(--green)}.t-due{background:var(--gold-soft);color:#7A5310}
.t-free{background:var(--sunk);color:var(--mute)}.t-canc{background:var(--red-soft);color:var(--red)}
.wrapx{overflow:auto;max-height:70vh;-webkit-overflow-scrolling:touch}
.wrapx table{min-width:860px}
main{min-width:0}.card{overflow:hidden}
/* events editor + scan codes */
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h4.sec{margin:22px 0 8px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:600}
h4.sec .note{text-transform:none;letter-spacing:0;color:var(--mute);font-weight:400}
.ev-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:10px}
.evc{display:flex;gap:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s;min-width:0}
.evc:hover{border-color:var(--ink);box-shadow:0 8px 24px rgba(15,27,45,.08)}
.evc-img{flex:0 0 108px;background:var(--sunk);display:grid;place-items:center}
.evc-img img{width:100%;height:100%;object-fit:cover;display:block}
.evc-img span{font-size:11px;color:#8A93A0;text-align:center;padding:6px}
.evc-b{padding:11px 12px 11px 0;min-width:0;display:flex;flex-direction:column;gap:3px}
.evc-t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.evc-t b{overflow-wrap:anywhere}
.upl{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.upl-p{flex:0 0 260px;max-width:100%;aspect-ratio:16/9;background:var(--sunk);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden}
.upl-p img{width:100%;height:100%;object-fit:cover;display:block}
.upl-p span{font-size:12px;color:#8A93A0}
.upl-c{flex:1 1 260px;min-width:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.th{position:relative;width:104px;aspect-ratio:16/9;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:8px}
.gi{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff;display:flex;flex-direction:column;gap:6px}
.gi-p{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;font-size:13px;color:var(--mute)}
.gi-p img{width:100%;height:100%;object-fit:cover;display:block}
.gi-d{position:absolute;left:6px;bottom:6px;background:rgba(15,27,45,.8);color:#fff;font-size:12px;border-radius:99px;padding:2px 8px}
.gi-x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(15,27,45,.75);color:#fff;cursor:pointer}
.gi-date{font-size:12.5px;color:var(--mute)}.gi-date.miss{color:#8a5a00;background:#FFF6E0;border-radius:8px;padding:4px 6px}
.gi-date input{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;margin-top:2px}
input.t.sm{padding:6px 9px;font-size:13.5px}
label.own{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:8px;color:var(--mute)}
.th button{position:absolute;top:3px;right:3px;border:0;border-radius:99px;width:20px;height:20px;background:rgba(15,27,45,.82);color:#fff;cursor:pointer;font-size:11px;line-height:1}
.row2,.row3{display:flex;gap:8px;margin-bottom:7px;align-items:center;flex-wrap:wrap}
.row2>input.t{flex:1 1 200px;min-width:0}
.row3>input.t:first-child{flex:0 0 92px}
.row3>input.t:nth-child(2){flex:1 1 180px;min-width:0}
.qrout{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.qrbox{flex:0 0 172px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.qrbox img{width:100%;display:block}
input[type=file]{font-size:13px;max-width:100%}
textarea.t{resize:vertical;font-family:inherit}

.drawer{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(15,27,45,.12);padding:22px;overflow:auto;display:none;z-index:9}
.drawer.on{display:block}
.drawer .x{position:absolute;right:16px;top:14px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--mute)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;margin:14px 0}
.kv span{color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.log{font-size:13px;color:var(--mute);border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.log div{padding:3px 0}
.ev{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.note{font-size:13px;color:var(--mute)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label.l{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:6px}aside .brand,aside .who{display:none}main{padding:18px 14px 50px}.f2{grid-template-columns:1fr}}

/* ===== QA sweep, Sept 2026 ===== */
.ext::after{content:" ↗";opacity:.6}
a.btn{color:inherit}a.btn-dark,a.btn-green,a.btn-wa{color:#fff}
.btn.danger{color:var(--red)}
.ev{align-items:center}.ev>div:last-child:not(:first-child){flex:none}
.ev .btn{white-space:nowrap}
.pwf{position:relative}.pwf input.t{padding-right:64px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--sunk);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mute)}
.pwgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px;max-width:900px}
#pwfirst{min-height:100vh;place-items:center;padding:24px}
#pwfirst .lcard label.l{margin-top:14px}
.subcard{border:1px solid var(--line);border-radius:14px;padding:4px 16px 16px;margin:10px 0;background:var(--paper)}
.pwcard{border:1px solid var(--gold);background:var(--gold-soft);border-radius:14px;padding:14px 16px;margin:10px 0}
.pwshow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}.pwshow code{font-size:20px;letter-spacing:.06em;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;user-select:all}
.team{margin-top:10px;border-top:1px solid var(--line)}
.tm{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tm-a{display:flex;gap:12px;min-width:0;flex:1 1 280px}.tm-a b{overflow-wrap:anywhere}.tm-a .note{overflow-wrap:anywhere}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.tm-b{flex:0 1 380px}.tm-b select.t{max-width:260px}
.evc-img span,.tag{font-size:12px}
@media(max-width:640px){
  input.t,select.t,textarea.t,.lcard input{font-size:16px}
  main{padding:14px 12px 60px}
  .card{padding:14px;border-radius:14px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px 14px}.kpi b{font-size:20px}
  .filters input.t,.filters select.t{min-width:0;flex:1 1 140px}
  .ev{flex-wrap:wrap}.ev>div:first-child{flex:1 1 100%}
  .wrapx{max-height:none;overflow:visible}
  .wrapx table{min-width:0}
  .wrapx thead{display:none}
  .wrapx tbody tr{display:block;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;background:#fff}
  .wrapx td{display:block;position:relative;border:0;padding:4px 0 4px 100px;min-height:26px;overflow-wrap:anywhere}
  .wrapx td::before{content:attr(data-l);position:absolute;left:0;top:6px;width:92px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
  .wrapx td[data-l=""]{padding-left:0}.wrapx td[data-l=""]::before{display:none}
  .wrapx td:empty{display:none}
  .pwgrid{grid-template-columns:1fr}
  .row3{flex-wrap:nowrap}.row3>input.t:first-child{flex:0 0 76px}.row3>input.t:nth-child(2){flex:1 1 auto}.row3 .btn{padding:9px 12px;flex:none}
  .drawer{padding:18px 16px}
  .kv{grid-template-columns:96px 1fr}
  .hd>div{flex-wrap:wrap}
}
@media(pointer:coarse){input.t,select.t,textarea.t,.lcard input{font-size:16px}}
/* ===== v2 shell: sidebar, top bar, bottom bar on phones ===== */
:root{--side:252px;--top:60px;--shadow:0 1px 2px rgba(15,27,45,.04),0 6px 18px rgba(15,27,45,.05);--blue:#2F5D8C;--blue-soft:#E4ECF5}
body{background:#F5F5F2}
.kente{height:4px}
#app{display:none;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#DDE2E9;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;z-index:30}
.side .brand{display:flex;gap:11px;align-items:center;padding:18px 18px 10px;color:#fff;text-decoration:none}
.side .brand .mark{width:34px;height:34px;background:var(--gold);color:#fff;font-size:15px}
.side .brand b{display:block;font-size:15.5px;letter-spacing:-.01em}.side .brand small{display:block;font-size:12px;color:#9AA6B6;font-weight:500}
.nav{padding:0 10px 14px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.nav h6{margin:14px 10px 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7F8C9D;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:8px;color:#C9D1DB;text-decoration:none;font-size:14.5px;cursor:pointer;position:relative;line-height:1.3}
.nav a svg{width:18px;height:18px;flex:none;opacity:.75}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}.nav a.on svg{opacity:1}
.nav a.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .b{margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;padding:0 7px;font-size:12px;line-height:20px;min-width:22px;text-align:center;font-weight:600}
.nav .b:empty{display:none}.nav .b.warn{background:#C0492F;color:#fff}
.side .links{padding:0 20px 10px;display:flex;gap:14px;flex-wrap:wrap}
.side .links a{color:#9AA6B6;font-size:13px;text-decoration:none}.side .links a:hover{color:#fff}
.side .me{border-top:1px solid rgba(255,255,255,.1);padding:12px 14px;display:flex;gap:10px;align-items:center}
.side .me .av{width:34px;height:34px;background:#2A3A52;font-size:14px}
.side .me b{display:block;color:#fff;font-size:14px;line-height:1.2}.side .me small{color:#9AA6B6;font-size:12px}
.side .me button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.2);color:#DDE2E9;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.side .me button:hover{background:rgba(255,255,255,.08)}
.mainw{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:var(--top);background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 24px}
.hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;place-items:center;cursor:pointer;flex:none}
.hamb svg,.iconbtn svg{width:20px;height:20px}
.crumb{font-size:14px;color:var(--mute);white-space:nowrap}.crumb b{color:var(--ink);font-weight:600}
.gsearch{position:relative;margin-left:auto;width:min(440px,42vw)}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 40px 9px 36px;outline:none;font-size:14.5px}
.gsearch input:focus{background:#fff;border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,27,45,.07)}
.gsearch>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute);pointer-events:none}
.gsearch kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:12px ui-monospace,monospace;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:#fff}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(15,27,45,.16);max-height:70vh;overflow:auto;display:none;z-index:40;padding:4px 0}
.sres.on{display:block}
.sres h6{margin:10px 14px 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.sres a{display:block;padding:8px 14px;cursor:pointer;text-decoration:none;color:inherit}.sres a:hover,.sres a.hl{background:var(--sunk)}
.sres a small{display:block;color:var(--mute);font-size:13px}
.sres .none{padding:14px;color:var(--mute);font-size:14px}
.newbtn{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(15,27,45,.16);padding:6px;min-width:230px;display:none;z-index:40}
.menu.on{display:block}
.menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:10px;border-radius:8px;cursor:pointer;text-align:left;font-size:14.5px}
.menu button:hover{background:var(--sunk)}.menu button svg{width:18px;height:18px;color:var(--mute)}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--sunk)}
main{padding:22px 24px 60px;max-width:1440px;width:100%}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{font-size:26px;letter-spacing:-.025em}
.phead p{margin:4px 0 0;color:var(--mute);font-size:14.5px}
.pact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{box-shadow:var(--shadow);border-color:#E6E7E9}
.kpis{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.kpi{box-shadow:var(--shadow);border-color:#E6E7E9;position:relative}
.kpi b{font-variant-numeric:tabular-nums}
.kpi small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:var(--ink)}
.bnav{display:none}
#scrim{position:fixed;inset:0;background:rgba(15,27,45,.38);z-index:45;display:none}
#scrim.on{display:block}
.drawer{z-index:50;width:min(560px,100%)}
#drb a:not(.btn):not(.chip){color:var(--ink);text-decoration:underline;text-decoration-color:#B9BEC6;text-underline-offset:3px}
.drawer.wide{width:min(720px,100%)}
table td{font-variant-numeric:tabular-nums}
/* shared bits for the CRM views */
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--ink);white-space:nowrap;text-decoration:none;cursor:default}
a.chip{cursor:pointer}a.chip:hover{background:#E7E7E1}
.chip.gold{background:var(--gold-soft);color:#7A5310}.chip.green{background:var(--green-soft);color:var(--green)}.chip.red{background:var(--red-soft);color:var(--red)}.chip.blue{background:var(--blue-soft);color:var(--blue)}
.av.sm{width:26px;height:26px;font-size:12px}
.empty{padding:26px 10px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.grid2 .card{margin-bottom:18px}
.ch h3{font-size:17px}
.list{margin:0;padding:0;list-style:none}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{overflow-wrap:anywhere}
.muted{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
/* tasks */

<script>
/* Sign in with Google: shown only when the server has it switched on; explains a refused sign-in */
(()=>{const GERR={not_in_team:'That Google account is not in the team list. Ask an owner to add your email under Settings → Team, then try again.',
  expired:'The Google sign-in took too long or was opened twice. Please try again.',cancelled:'Google sign-in was cancelled.',failed:'Google sign-in did not work. Please try again, or use your password.',
  off:'Google sign-in is not switched on yet.',busy:'Too many tries. Wait a few minutes.'};
 const g=new URLSearchParams(location.search).get('google');
 addEventListener('DOMContentLoaded',()=>{
  fetch('/api/auth/options').then(r=>r.json()).then(o=>{if(o.google){const w=document.getElementById('gwrap');if(w)w.hidden=false}}).catch(()=>{});
  if(g&&GERR[g]){const e=document.getElementById('lerr');if(e)e.textContent=GERR[g];history.replaceState(null,'',location.pathname+location.hash)}});
})();

const $=s=>document.querySelector(s), api=(u,o={})=>fetch(u,{credentials:'same-origin',headers:{'content-type':'application/json'},...o}).then(async r=>{const d=await r.json().catch(()=>({}));
 if(r.status===401&&d.error==='no_session'&&ME&&!/\/api\/(me|login|password)$/.test(u)){ME=null;toast('You were signed out. Please sign in again.');setTimeout(()=>location.reload(),1600)}
 if(!r.ok)throw Object.assign(new Error(d.error||r.status),d);return d});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=(n,c)=>Number(n)===0?'Free':c+' '+Number(n).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:2});
const amt=(n,c)=>c+' '+Number(n).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:2});
const dt=s=>s?new Date(s).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const day=s=>s?new Date(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'—';
let ME=null, ROWS=[], STATS=null, ITEMS=[], SET={}, ALL_ITEMS=[], VENUE_MAX=0, SPONSORS=[];
const SITEBASE=location.origin;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};

/* login */
let LTICKET=null;
$('#lform').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';
 try{
  if(LTICKET){ME=await api('/api/login/code',{method:'POST',body:JSON.stringify({ticket:LTICKET,code:$('#lcode').value})});LTICKET=null;return start()}
  const r=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#e').value,password:$('#pw').value})});
  if(r.need_code){LTICKET=r.ticket;$('#codewrap').hidden=false;$('#lbtn').textContent='Continue';$('#lcode').focus();return}
  ME=r;start()}
 catch(err){if(err.message==='expired'){LTICKET=null;$('#codewrap').hidden=true;$('#lbtn').textContent='Sign in'}
  $('#lerr').textContent={bad_login:'Wrong username or password.',too_many:'Too many attempts. Wait 5 minutes.',bad_code:'That code is not right. Codes change every 30 seconds.',expired:'That took too long. Enter your password again.'}[err.message]||'Could not sign in.'}};
$('#out').onclick=async()=>{await fetch('/api/logout',{credentials:'same-origin'});location.reload()};

async function start(){
 $('#login').style.display='none';
 if(ME.must_change){$('#app').style.display='none';return firstPassword()}
 $('#pwfirst').style.display='none';$('#app').style.display='grid';
 $('#mename').textContent=ME.name||ME.email;$('#who').textContent=ROLE_NAME[ME.role];$('#meav').textContent=initials(ME.name||ME.email);
 buildNav();parseHash();await loadUsers();await load();badges();chatBadge();
}
/* password fields with a show/hide toggle, shared by the first-sign-in screen and Settings */
const pwField=(id,label,ac)=>`<label class="l" for="${id}">${label}</label><div class="pwf"><input class="t" id="${id}" type="password" autocomplete="${ac}" autocapitalize="off" spellcheck="false"><button type="button" class="eye" data-eye="${id}" aria-label="Show password">Show</button></div>`;
function wireEyes(root){root.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye);const s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show';b.setAttribute('aria-label',s?'Hide password':'Show password')})}
const PW_MSG={wrong_current:'Your current password is not right.',too_short:'Use at least 10 characters.',too_long:'That is too long (200 characters at most).',same_as_old:'Choose a password you have not used here before.',too_weak:'That password is too easy to guess.',too_many:'Too many tries. Wait 5 minutes.',mismatch:'The two new passwords do not match.'};
async function changePassword(cur,np,np2,out){
 out.textContent='';out.className='err';
 if(np!==np2){out.textContent=PW_MSG.mismatch;return false}
 try{const r=await api('/api/password',{method:'POST',body:JSON.stringify({current:cur,password:np})});ME={...ME,...r,must_change:false};return true}
 catch(e){out.textContent=PW_MSG[e.message]||'Could not change the password.';return false}
}
function firstPassword(){
 const s=$('#pwfirst');s.style.display='grid';
 s.innerHTML=`<form class="lcard" id="pwform" novalidate>
  <div style="display:flex;gap:12px;align-items:center"><div class="mark"><img src="/admin/brand/mark-white-256.png" alt=""></div><div><b>Choose your own password</b><div class="note">Signed in as ${esc(ME.email)}</div></div></div>
  <p class="note" style="margin:14px 0 0">You are using a password someone gave you. Pick your own before you continue. Only you will know it: nobody at Gotham Consult can see it, only reset it.</p>
  ${pwField('fp-cur','The password you were given','current-password')}
  ${pwField('fp-new','New password · 10 characters or more','new-password')}
  ${pwField('fp-new2','New password again','new-password')}
  <p class="err" id="fp-err"></p>
  <button class="btn btn-dark" style="width:100%;justify-content:center;margin-top:6px">Save and continue</button>
  <button type="button" class="btn btn-line" id="fp-out" style="width:100%;justify-content:center;margin-top:8px">Sign out</button></form>`;
 wireEyes(s);
 $('#pwform').onsubmit=async e=>{e.preventDefault();
  if(await changePassword($('#fp-cur').value,$('#fp-new').value,$('#fp-new2').value,$('#fp-err'))){toast('Password saved');start()}};
 $('#fp-out').onclick=async()=>{await fetch('/api/logout',{credentials:'same-origin'});location.reload()};
 $('#fp-cur').focus();
}
async function load(){
 [STATS,{rows:ROWS},{items:ITEMS,settings:SET}]=await Promise.all([api('/api/stats'),api('/api/registrations'),api('/api/items')]);
 VENUE_MAX=parseInt(SET.max_seats)||0;
 if($('#cnt'))$('#cnt').textContent=ROWS.filter(r=>r.status==='pending').length||'';
 render();
}
/* ===================== v2 shell: navigation, search, quick add ===================== */
const ROLE_NAME={owner:'owner (super admin)',admin:'admin',staff:'staff'};
const isAdmin=()=>!!ME&&ME.role!=='staff';
const ic=n=>`<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const initials=s=>String(s||'?').replace(/@.*/,'').split(/[\s._-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const first=s=>String(s||'').trim().split(/[\s@]+/)[0]||'';
const ghs=n=>'GHS '+Number(n||0).toLocaleString('en-GB',{maximumFractionDigits:0});
const ghsShort=n=>{n=Number(n||0);return n>=1e6?'GHS '+(n/1e6).toFixed(n>=1e7?0:1)+'m':n>=1e4?'GHS '+Math.round(n/1e3)+'k':ghs(n)};
const dshort=s=>s?new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
const NAV=[
 ['Overview',[['dash','Dashboard','home'],['cal','Calendar','cal'],['tasks','Tasks','check','tcnt'],['chat','Team chat','chat','chcnt']]],
 ['Sales',[['pipe','Pipeline','cols',null,1],['contacts','Companies & people','users',null,1],['imp','Import clients','upload',null,1],['out','Outreach & campaigns','send',null,1],['spon','Sponsors','star',null,1],['inv','Invoices & quotes','bill',null,1],['reports','Reports','chart',null,1],['web','Website visitors','globe2',null,1]]],
 ['Events',[['regs','Registrations','ticket','cnt'],['events','Events & media','cal',null,1],['door','Door check-in','scan'],['subs','Subscribers','news','scnt',1],['qr','Scan codes & posters','qr',null,1],['links','Campaign links','link',null,1]]],
 ['System',[['mail','Email outbox','mail','mcnt',1],['data','Data health','shield',null,1],['settings','Settings','gear']]]];
const TITLES={dash:'Dashboard',chat:'Team chat',cal:'Calendar',tasks:'Tasks',pipe:'Pipeline',contacts:'Companies & people',imp:'Import clients',inv:'Invoices & quotes',web:'Website visitors',rec:'Company record',reports:'Reports',
 regs:'Registrations',events:'Events, content & media',subs:'Ghana Business Brief subscribers',door:'Door check-in',mail:'Email outbox',
 out:'Outreach & campaigns',spon:'Sponsors, partners & advertising',qr:'Scan codes & posters',links:'Campaign links',data:'Data health',settings:'Settings'};
const ADMIN_ONLY=new Set(['web','inv','pipe','contacts','imp','rec','reports','out','spon','events','subs','qr','links','mail','data']);
let V='dash', ARG=null, USERS=[];
function buildNav(){
 $('#nav').innerHTML=NAV.map(([g,items])=>{const it=items.filter(x=>!x[4]||isAdmin());
  return it.length?`<h6>${g}</h6>`+it.map(([v,l,i,b])=>`<a data-v="${v}" href="#${v}">${ic(i)}<span>${l}</span>${b?`<span class="b" id="${b}"></span>`:''}</a>`).join(''):''}).join('');
 const bn=isAdmin()?[['dash','Home','home'],['tasks','Tasks','check','tcnt2'],['chat','Chat','chat','chcnt2'],['contacts','Contacts','users'],['more','More','dots']]
                   :[['dash','Home','home'],['chat','Chat','chat','chcnt2'],['regs','Guests','ticket'],['door','Check-in','scan'],['more','More','dots']];
 $('#bnav').innerHTML=bn.map(([v,l,i,b])=>`<a data-b="${v}" ${v!=='more'?`href="#${v}"`:'role="button" tabindex="0"'}>${ic(i)}<span>${l}</span>${b?`<span class="b" id="${b}"></span>`:''}</a>`).join('');
 $('#bnav [data-b="more"]').onclick=openSide;
 document.querySelectorAll('[data-admin]').forEach(e=>e.hidden=!isAdmin());
 $('#gq').placeholder=isAdmin()?'Search companies, people, deals, references':'Search guests by name or reference';
}
function setTitle(t,sub){$('#vt').textContent=t;$('#vsub').textContent=sub||'';$('#crumb').innerHTML='Gotham CRM / <b>'+esc(t)+'</b>';document.title=t+' · Gotham CRM'}
function parseHash(){const [v,a]=(location.hash.slice(1)||'dash').split('/');V=TITLES[v]?v:'dash';if(!isAdmin()&&ADMIN_ONLY.has(V))V='dash';if(V!==v&&location.hash)history.replaceState(null,'','#'+V);ARG=a===undefined?null:decodeURIComponent(a);
 document.querySelectorAll('#nav a').forEach(x=>x.classList.toggle('on',x.dataset.v===V||(V==='rec'&&x.dataset.v==='contacts')));
 document.querySelectorAll('#bnav a').forEach(x=>x.classList.toggle('on',x.dataset.b===V||(V==='rec'&&x.dataset.b==='contacts')));
 setTitle(TITLES[V]);}
function go(v,arg){const h='#'+v+(arg!=null?'/'+encodeURIComponent(arg):'');if(location.hash!==h)location.hash=h;else route()}
function route(){parseHash();closeSide();closeDr();$('#sres').classList.remove('on');scrollTo(0,0);render()}
addEventListener('hashchange',()=>{if(ME&&!ME.must_change)route()});
function pageActions(html){$('#pact').innerHTML=html+`<button class="iconbtn" id="pref" type="button" title="Refresh" aria-label="Refresh">${ic('refresh')}</button>`;
 $('#pref').onclick=async()=>{await load();toast('Updated')}}
function render(){
 const m={dash:dashboard,chat:chatView,cal:calView,tasks:tasksView,pipe:pipeline,contacts:contactsView,imp:importView,inv:invoicesView,web:webView,rec:()=>record(+ARG),reports:reportsView,
  regs,events,qr:qrview,spon:sponsors,out:outreach,links,subs,door,mail,data,settings};
 const acts={regs:'<a class="btn btn-line" href="/api/export.csv">Export CSV</a>',pipe:'<button class="btn btn-dark" data-new="deal">New deal</button>',
  contacts:'<a class="btn btn-line" href="#imp">Import</a><button class="btn btn-dark" data-new="contact">Add company or person</button>',tasks:'<button class="btn btn-dark" data-new="task">New task</button>',
  inv:`<button class="btn btn-line" data-new="acct">For the accountant</button><button class="btn btn-line" data-new="quote">New quotation</button><button class="btn btn-dark" data-new="invoice">New invoice</button>`};
 pageActions(acts[V]||'');
 const f=m[V];if(!f)return;const r=f();if(typeof r==='string')$('#view').innerHTML=r;
}
/* side menu on phones */
function openSide(){$('#side').classList.add('open');$('#scrim').classList.add('side-on')}
function closeSide(){$('#side').classList.remove('open');$('#scrim').classList.remove('side-on')}
$('#hamb').onclick=openSide;
/* the drawer gets a dimmed backdrop, and Escape closes it */
function closeDr(){$('#dr').classList.remove('on','wide')}
new MutationObserver(()=>$('#scrim').classList.toggle('on',$('#dr').classList.contains('on'))).observe($('#dr'),{attributes:true,attributeFilter:['class']});
$('#scrim').onclick=()=>{closeDr();closeSide()};
$('#drx').onclick=closeDr;
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeDr();closeSide();$('#sres').classList.remove('on');$('#newm').classList.remove('on')}
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&ME){e.preventDefault();$('#gq').focus()}
});
/* + New */
$('#newb').onclick=e=>{e.stopPropagation();$('#newm').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('.newbtn'))$('#newm').classList.remove('on');if(!e.target.closest('#gs'))$('#sres').classList.remove('on');
 const n=e.target.closest('[data-new]');if(!n)return;$('#newm').classList.remove('on');
 ({task:()=>taskForm({}),deal:()=>dealForm({}),contact:()=>contactForm(null),event:()=>go('events'),quote:()=>invNew('quote'),invoice:()=>invNew('invoice'),acct:acctPanel})[n.dataset.new]?.()});
/* global search */
let sT=0,sItems=[],sHl=-1;
$('#gq').addEventListener('input',()=>{clearTimeout(sT);const s=$('#gq').value.trim();if(s.length<2){$('#sres').classList.remove('on');return}sT=setTimeout(()=>doSearch(s),170)});
$('#gq').addEventListener('keydown',e=>{if(!$('#sres').classList.contains('on'))return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sHl=(sHl+(e.key==='ArrowDown'?1:-1)+sItems.length)%sItems.length;
  document.querySelectorAll('#sres a').forEach((a,i)=>a.classList.toggle('hl',i===sHl))}
 if(e.key==='Enter'){e.preventDefault();(sItems[sHl]||sItems[0])?.();}});
async function doSearch(s){
 let groups=[];
 if(isAdmin()){const r=await api('/api/search?q='+encodeURIComponent(s)).catch(()=>null);if(!r)return;
  groups=[['Companies & people',r.contacts.map(c=>[c.company||c.full_name||c.email,[c.company&&c.full_name,c.phone,c.sector].filter(Boolean).join(' · '),()=>go('rec',c.id)])],
   ['Deals',r.deals.map(d=>[d.title,[STAGE_NAME[d.stage],ghs(d.value),d.company].filter(Boolean).join(' · '),()=>openDeal(d.id)])],
   ['Registrations',r.registrations.map(g=>[g.full_name+(g.company&&g.company!=='Not given'?' · '+g.company:''),g.reference+' · '+g.title+' · '+g.status,()=>{go('regs');setTimeout(()=>drawer(g.id),350)}])]];
 } else {const f=s.toLowerCase();groups=[['Guests',ROWS.filter(r=>[r.full_name,r.company,r.reference].join(' ').toLowerCase().includes(f)).slice(0,10)
   .map(g=>[g.full_name,g.reference+' · '+g.item_title,()=>{go('regs');setTimeout(()=>drawer(g.id),350)}])]]}
 sItems=[];sHl=-1;
 const html=groups.filter(g=>g[1].length).map(([h,items])=>`<h6>${h}</h6>`+items.map(([t,sub,fn])=>{sItems.push(fn);return `<a data-si="${sItems.length-1}"><b>${esc(t)}</b><small>${esc(sub)}</small></a>`}).join('')).join('');
 $('#sres').innerHTML=html||'<div class="none">Nothing found for “'+esc(s)+'”.</div>';$('#sres').classList.add('on');
 document.querySelectorAll('#sres a').forEach(a=>a.onclick=()=>{$('#sres').classList.remove('on');$('#gq').value='';$('#gq').blur();sItems[+a.dataset.si]()});
}
async function loadUsers(){USERS=(await api('/api/users').catch(()=>({rows:[]}))).rows.filter(u=>u.active!==false)}
const userName=e=>{const u=USERS.find(x=>x.email===e);return u?(u.name||u.email):(e||'Unassigned')};
const userOpts=(sel,withNone)=>(withNone?`<option value="" ${!sel?'selected':''}>Unassigned</option>`:'')+USERS.map(u=>`<option value="${esc(u.email)}" ${u.email===sel?'selected':''}>${esc(u.name||u.email)}${u.email===ME.email?' (you)':''}</option>`).join('');
async function badges(){const o=await api('/api/overview').catch(()=>null);if(!o)return null;const n=(o.my_tasks.overdue||0)+(o.my_tasks.today||0);
 ['#tcnt','#tcnt2'].forEach(s=>{const e=$(s);if(e){e.textContent=n||'';e.classList.toggle('warn',o.my_tasks.overdue>0)}});return o}

/* ===================== dashboard ===================== */
async function dashboard(){
 const h=new Date().getHours();setTitle((h<12?'Good morning':h<17?'Good afternoon':'Good evening')+', '+first(ME.name||ME.email),new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
 $('#view').innerHTML='<div class="empty">Loading…</div>';
 const [o,tk]=await Promise.all([badges(),api('/api/tasks?scope=mine')]);if(!o||V!=='dash')return;
 const ev=o.next_event, pend=ROWS.filter(r=>r.status==='pending'), unpaid=ROWS.filter(r=>!r.paid&&Number(r.amount)>0&&!['cancelled','declined'].includes(r.status));
 const kp=(label,val,sub,to)=>`<div class="kpi ${to?'link':''}" ${to?`data-go="${to}"`:''}><span>${label}</span><b>${val}</b>${sub?`<small>${sub}</small>`:''}</div>`;
 const t=o.my_tasks;
 const kpis=isAdmin()?kp('Open pipeline',ghsShort(o.pipeline_value),o.open_deals+' open deals','pipe')+kp('Won this month',ghsShort(o.won_month.v),o.won_month.n+' deals','reports')
   +kp('Received this month',ghsShort(o.received_month),'forums, services and sponsors','reports')+kp('Registrations',o.regs_week,'in the last 7 days','regs')
   +kp('My tasks',t.open,(t.overdue?`<b style="color:var(--red);display:inline;font-size:13px">${t.overdue} overdue</b> · `:'')+t.today+' due today','tasks')
  :kp('Registrations',o.regs_week,'in the last 7 days','regs')+kp('My tasks',t.open,t.overdue?t.overdue+' overdue':t.today+' due today','tasks')+(ev?kp('Seats taken',ev.seats+(ev.capacity?' / '+ev.capacity:''),esc(ev.title),'regs'):'');
 const today=tk.rows.filter(x=>!x.due_at||new Date(x.due_at)<new Date(new Date().setHours(24,0,0,0))).slice(0,8);
 const upcoming=tk.rows.filter(x=>x.due_at&&new Date(x.due_at)>=new Date(new Date().setHours(24,0,0,0))).slice(0,4);
 const evCard=ev?`<div class="card"><div class="ch"><div><p class="note" style="margin:0 0 2px">Next event · ${new Date(ev.starts_at).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}, ${new Date(ev.starts_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Accra'})}</p><h3>${esc(ev.title)}</h3><p class="note" style="margin:2px 0 0">${esc(ev.venue||'')}</p></div>

/* ===================== tasks ===================== */
let TSCOPE='mine';
const dayStart=(d=0)=>{const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()+d);return x};
function dueLabel(t){if(!t.due_at)return '';const d=new Date(t.due_at);if(t.done_at)return dshort(d);
 if(d<dayStart(0))return `<span class="due over">Overdue · ${dshort(d)}</span>`;if(d<dayStart(1))return `<span class="due today">Today ${d.getHours()||d.getMinutes()?d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):''}</span>`;
 if(d<dayStart(2))return '<span class="due">Tomorrow</span>';return `<span class="due">${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</span>`}
function taskRow(t){return `<li class="li task ${t.done_at?'done':''}" data-tid="${t.id}"><input type="checkbox" class="tcheck" data-tdone="${t.id}" ${t.done_at?'checked':''} aria-label="Done: ${esc(t.title)}">
 <div class="grow" data-topen="${t.id}" style="cursor:pointer"><b>${t.priority==='high'?'<span class="pri" title="High priority">! </span>':''}${esc(t.title)}</b>
 <div class="meta">${dueLabel(t)}${t.company||t.contact_name?`<a class="chip" href="#rec/${t.contact_id}" onclick="event.stopPropagation()">${esc(t.company||t.contact_name)}</a>`:''}${t.deal_title?`<span class="chip gold">${esc(t.deal_title)}</span>`:''}${TSCOPE!=='mine'||V!=='tasks'?(t.assignee?`<span class="chip">${esc(first(userName(t.assignee)))}</span>`:'<span class="chip red">Unassigned</span>'):''}</div></div></li>`}
let TASKCACHE={};
function wireTasks(root,redraw){const here=V+'/'+ARG,inDrawer=root.id==='drb';
 root.querySelectorAll('[data-tdone]').forEach(c=>c.onchange=async()=>{c.closest('.task').classList.toggle('done',c.checked);
  await api('/api/tasks/'+c.dataset.tdone,{method:'PATCH',body:JSON.stringify({done:c.checked})});toast(c.checked?'Done':'Reopened');badges();
  setTimeout(()=>{if(inDrawer?$('#dr').classList.contains('on'):V+'/'+ARG===here)redraw()},400)});
 root.querySelectorAll('[data-topen]').forEach(c=>c.onclick=async()=>{const id=+c.dataset.topen;const t=TASKCACHE[id]||(await api('/api/tasks?scope=all')).rows.find(x=>x.id===id);if(t)taskForm(t)});
}
async function tasksView(){
 setTitle('Tasks','Follow-ups for you'+(isAdmin()?' and the team':''));
 const scopes=isAdmin()?[['mine','Mine'],['unassigned','Unassigned'],['all','Everyone'],['done','Done']]:[['mine','Mine'],['done','Done']];
 if(!scopes.find(s=>s[0]===TSCOPE))TSCOPE='mine';
 $('#view').innerHTML=`<div class="card"><div class="qadd"><input class="t" id="qa-t" placeholder="Add a task, e.g. Call Kojo about the sponsorship pack" aria-label="New task">
  <input class="t" id="qa-d" type="date" aria-label="Due date" value="${dayStart(0).toISOString().slice(0,10)}">
  ${isAdmin()?`<select class="t" id="qa-a" aria-label="Assign to">${userOpts(ME.email,true)}</select>`:''}
  <button class="btn btn-dark" id="qa-go">Add</button></div>
  <div class="presets" id="qa-p"><button data-d="0" class="on">Today</button><button data-d="1">Tomorrow</button><button data-d="7">Next week</button><button data-d="">No date</button><button data-hi>High priority</button></div></div>
  <div style="margin:4px 0 6px"><div class="seg" id="tseg">${scopes.map(([k,l])=>`<button data-s="${k}" class="${k===TSCOPE?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="card" id="tlist"><div class="empty">Loading…</div></div>`;
 let hi=false;
 $('#qa-p').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.hi!==undefined){hi=!hi;b.classList.toggle('on',hi);return}
  $('#qa-p').querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b));$('#qa-d').value=b.dataset.d===''?'':dayStart(+b.dataset.d).toISOString().slice(0,10)};
 const add=async()=>{const title=$('#qa-t').value.trim();if(!title){$('#qa-t').focus();return toast('Write the task first')}
  const d=$('#qa-d').value;await api('/api/tasks',{method:'POST',body:JSON.stringify({title,due_at:d?d+'T09:00:00':null,priority:hi?'high':'normal',assignee:$('#qa-a')?$('#qa-a').value:ME.email})});
  $('#qa-t').value='';toast('Task added');draw();badges()};
 $('#qa-go').onclick=add;$('#qa-t').onkeydown=e=>{if(e.key==='Enter')add()};
 $('#tseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;TSCOPE=b.dataset.s;$('#tseg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw()};
 async function draw(){
  const q=TSCOPE==='done'?'?scope='+(isAdmin()?'all':'mine')+'&status=done':'?scope='+TSCOPE;
  const r=await api('/api/tasks'+q);if(!$('#tlist'))return;TASKCACHE=Object.fromEntries(r.rows.map(t=>[t.id,t]));
  if(TSCOPE==='done'){$('#tlist').innerHTML=r.rows.length?`<ul class="list">${r.rows.map(taskRow).join('')}</ul>`:'<div class="empty">Nothing finished in the last 30 days.</div>';return wireTasks($('#tlist'),draw)}
  const g={over:[],today:[],week:[],later:[],none:[]};
  r.rows.forEach(t=>{const d=t.due_at&&new Date(t.due_at);(!d?g.none:d<dayStart(0)?g.over:d<dayStart(1)?g.today:d<dayStart(7)?g.week:g.later).push(t)});
  const sec=(k,l)=>g[k].length?`<div class="tgroup ${k==='over'?'over':''}">${l} · ${g[k].length}</div><ul class="list">${g[k].map(taskRow).join('')}</ul>`:'';
  $('#tlist').innerHTML=r.rows.length?sec('over','Overdue')+sec('today','Today')+sec('week','Next 7 days')+sec('later','Later')+sec('none','No date')
   :`<div class="empty"><b>All clear.</b>${TSCOPE==='mine'?'Nothing is waiting for you.':'No open tasks here.'}</div>`;
  wireTasks($('#tlist'),draw);
 }
 draw();
}

 $('#tf-t').focus();

 if(!isNew){$('#tf-done').onclick=async()=>{await api('/api/tasks/'+t.id,{method:'PATCH',body:JSON.stringify({done:!t.done_at})});toast('Updated');after()};

 $('#view').innerHTML=`<div class="filters"><input class="t" id="pf-q" placeholder="Filter deals" value="${esc(PF.q)}" style="max-width:220px">

 ['q','k','o','c'].forEach(k=>$('#pf-'+k).oninput=()=>{PF={q:$('#pf-q').value,kind:$('#pf-k').value,owner:$('#pf-o').value,closed:$('#pf-c').checked};drawBoard()});

 const cols=['lead','contacted','meeting','proposal'].concat(PF.closed?['won','lost']:[]);

  return `<section class="col ${s}" data-stage="${s}"><div class="colh"><div><b>${STAGE_NAME[s]}</b> <span>${ds.length}</span><span class="sum">${ghs(ds.reduce((a,d)=>a+Number(d.value),0))}</span></div></div>
  ${ds.map(d=>{const late=d.next_date&&new Date(d.next_date)<dayStart(0)&&!['won','lost'].includes(d.stage);
   return `<article class="dcard" draggable="true" data-deal="${d.id}"><b>${esc(d.title)}</b>${d.company&&d.company!==d.title?`<div class="co">${esc(d.company)}</div>`:''}
   <div class="row"><span class="val">${ghs(d.value)}</span><span style="display:flex;gap:6px;align-items:center">${KIND_CHIP[d.kind]!==undefined?`<span class="chip ${KIND_CHIP[d.kind]}">${KIND_NAME[d.kind]}</span>`:''}${d.owner?`<span class="av sm" title="Owner: ${esc(userName(d.owner))}">${initials(userName(d.owner))}</span>`:'<span class="av sm" title="No owner yet" style="background:#C9CED6">?</span>'}</span></div>
   ${d.next_step||d.next_date?`<div class="nx">${late?'<span class="due over">':''}${d.next_date?dshort(d.next_date)+' · ':''}${esc(d.next_step||'')}${late?'</span>':''}</div>`:''}
   ${d.open_tasks?`<div class="nx">☐ ${d.open_tasks} open task${d.open_tasks>1?'s':''}</div>`:''}</article>`}).join('')||'<div class="note" style="padding:6px 4px">Nothing here.</div>'}</section>`}).join('');

 year:['This year',()=>[new Date(new Date().getFullYear(),0,1),new Date()]],'12m':['Last 12 months',()=>[new Date(Date.now()-365*864e5),new Date()]]};

function csv(name,rows){const s=rows.map(r=>r.map(x=>{x=String(x??'');return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+s],{type:'text/csv'}));a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

 const get=(arr,m,key='v')=>arr.filter(r=>r.m===m).reduce((a,r)=>a+r[key],0);
 const recv=months.map(m=>[get(d.revenue_registrations,m),get(d.revenue_sponsors,m)]);
 const kinds=Object.keys(KIND_NAME),KC={sponsorship:'#A9761F',consulting:'#2F5D8C',family_desk:'#1F6B4E',investor:'#C9A24B',membership:'#0F1B2D',event:'#8A6FB0',other:'#9AA6B6'};
 const won=months.map(m=>kinds.map(k=>d.won_by_month.filter(r=>r.m===m&&r.kind===k).reduce((a,r)=>a+r.v,0)));
 const bars=(data,colors,fmt=ghsShort)=>{const mx=Math.max(1,...data.map(r=>r.reduce((a,b)=>a+b,0)));

 const totRecv=recv.reduce((a,r)=>a+r[0]+r[1],0),totWon=d.won_by_month.reduce((a,r)=>a+r.v,0),wl=d.winloss,rate=wl.won+wl.lost?Math.round(wl.won/(wl.won+wl.lost)*100):null;
 const fu=d.funnel,fmax=Math.max(1,fu.registered);
 const openSt=['lead','contacted','meeting','proposal'].map(s=>d.stages.find(x=>x.stage===s)||{stage:s,n:0,v:0}),smax=Math.max(1,...openSt.map(s=>s.v));
 const kp=(l,v2,s)=>`<div class="kpi"><span>${l}</span><b>${v2}</b>${s?`<small>${s}</small>`:''}</div>`;
 $('#rp').innerHTML=`<div class="kpis">${kp('Money received',ghsShort(totRecv),'forums, services and sponsors')+kp('Business won',ghsShort(totWon),wl.won+' deals')+kp('Win rate',rate===null?'—':rate+'%',wl.won+' won · '+wl.lost+' lost')+kp('Days to close',wl.days?Math.round(wl.days):'—','average for won deals')+kp('Registrations',fu.registered,fu.attended+' attended')+kp('Open tasks',d.tasks.open,d.tasks.overdue+' overdue · '+d.tasks.done+' done')}</div>
 <div class="rgrid">

   <h4 class="sec">By kind</h4><div class="wrapx"><table><thead><tr><th>Kind</th><th>Open</th><th>Open value</th><th>Won</th><th>Won value</th></tr></thead><tbody>${d.kinds.map(k=>`<tr><td>${KIND_NAME[k.kind]}</td><td>${k.open}</td><td>${ghs(k.open_v)}</td><td>${k.won}</td><td>${ghs(k.won_v)}</td></tr>`).join('')||'<tr><td colspan="5" class="note">No deals yet.</td></tr>'}</tbody></table></div></div>

function regs(){
 $('#view').innerHTML=`<div class="card"><div class="filters">

 };
 ['#q','#fi','#fp','#fs','#fc'].forEach(s=>{$(s).oninput=draw;$(s).onchange=draw});draw();

/* turn a picked file into a stored, resized media record */
function readFile(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function upload(file,kind,extra={}){
 const mb=(file.size/1048576).toFixed(1);
 if(file.size>(kind==='doc'?20:12)*1048576) throw new Error(kind==='doc'?'The PDF is '+mb+' MB. The limit is 20 MB.':'The image is '+mb+' MB. The limit is 12 MB.');
 const data=await readFile(file);
 return api('/api/media',{method:'POST',body:JSON.stringify({kind,name:file.name,data,...extra})});
}
/* videos go up in 4 MB pieces (a phone connection or the website bridge would drop one huge request), then the server converts them */
async function uploadVideo(file,extra={},progress=()=>{}){
 const st=await api('/api/uploads',{method:'POST',body:JSON.stringify({name:file.name,size:file.size,...extra})});
 const step=st.chunk||4194304;
 for(let at=0;at<file.size;){
  const piece=file.slice(at,at+step);let r,tries=0;
  for(;;){try{r=await fetch('/api/uploads/'+st.id+'?at='+at,{method:'PUT',body:piece,credentials:'same-origin',headers:{'content-type':'application/octet-stream'}});
    if(r.ok)break;const j=await r.json().catch(()=>({}));if(r.status===409&&j.got!=null){at=j.got;break}throw new Error(j.error||'upload_failed')}
   catch(e){if(++tries>3)throw e;await new Promise(ok=>setTimeout(ok,1500*tries))}}
  if(r.ok){at=(await r.json()).got}
  progress(Math.min(100,Math.round(at/file.size*100)));
 }
 return api('/api/uploads/'+st.id+'/done',{method:'POST',body:'{}'});
}

const dur=s=>s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'';
const UPERR={file_too_large:'That file is too large.',video_tools_missing:'Video conversion is not installed on the server yet.',not_a_video:'That video could not be read.',not_a_pdf:'That is not a PDF file.',not_an_image:'That image could not be read.',process_failed:'Could not process that file.'};

  EV.slug=g('#i-slug');EV.summary=g('#i-summary');EV.description=g('#i-desc');EV.venue=g('#i-venue');
  EV.starts_at=g('#i-start')?new Date(g('#i-start')).toISOString():null;

  EV.approval=g('#i-appr')==='true';EV.phase=g('#i-phase');EV.audiences=g('#i-aud');EV.recap=g('#i-recap');

   if(EV.documents[n]){EV.documents[n].label=el.value;EV.docs[n]={id:EV.documents[n].id,label:el.value}}});

 };

  collect();

  try{
   const r=await api('/api/items',{method:'POST',body:JSON.stringify({...EV,alt:undefined})});
   toast('Saved');EV.__new=false;EV.code=r.code;
   await load(); ALL_ITEMS=(await api('/api/items/all')).rows;
   EV=JSON.parse(JSON.stringify(ALL_ITEMS.find(x=>x.code===r.code)||EV));redraw();
  }catch(e){toast(e.error==='over_venue_limit'?('Seats cannot go above the venue limit of '+e.max+'. Change it in Settings if the room is bigger.')

 };

   if(!EV||!$('#i-gal'))return;let changed=false;
   for(const m of EV.images.filter(x=>x.kind==='video'&&x.status==='processing')){try{const r=await api('/api/media/'+m.id);if(r.status!=='processing'){Object.assign(m,r);changed=true}}catch{}}

 $('#i-sp-add').onclick=()=>{collect();EV.speakers.push({name:'',role:''});redraw()};
 document.querySelectorAll('[data-agdel]').forEach(b=>b.onclick=()=>{collect();EV.agenda.splice(+b.dataset.agdel,1);redraw()});
 document.querySelectorAll('[data-spdel]').forEach(b=>b.onclick=()=>{collect();EV.speakers.splice(+b.dataset.spdel,1);redraw()});

async function aiCall(body,btn){const was=btn&&btn.innerHTML;if(btn){btn.disabled=true;btn.innerHTML='<span class="ai-spin"></span>Thinking…'}
 try{return await api('/api/ai',{method:'POST',body:JSON.stringify(body)})}catch(e){toast(AIERR[e.error]||'The AI did not answer. Try again.');return null}
 finally{if(btn){btn.disabled=false;btn.innerHTML=was}}}

 box.innerHTML=`<label class="l">What is it about? <span class="note">— one or two lines is enough</span></label><textarea class="t" rows="2" placeholder="${esc(ph)}"></textarea>
  <div class="ai-acts"><button class="btn btn-dark" type="button">✦ Write it</button><button class="btn btn-line" type="button">Cancel</button><span class="note">The AI drafts; you check and edit before anything is sent.</span></div>`;
 after.insertAdjacentElement('afterend',box);const ta=box.querySelector('textarea'),[go,no]=box.querySelectorAll('button');ta.focus();
 no.onclick=()=>box.remove();
 go.onclick=async()=>{const t=ta.value.trim();if(!t)return toast(AIERR.brief_required);const r=await aiCall({...run.body,brief:t},go);if(r&&!r.error){run.done(r);box.remove()}};
 ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))go.click()});
}

const CALT={event:['Events','#A9761F'],task:['Tasks','#0F1B2D'],deal:['Next steps','#1F6B4E'],closed:['Won & lost','#6E8B3D'],campaign:['Campaigns','#6B4EA0'],

const CAL1={event:'event',task:'task',deal:'next step',closed:'deal won or lost',campaign:'campaign',activity:'call or meeting',registration:'registration day',payment:'payment day',sponsor:'sponsor date'};
let CAL=(()=>{let s={};try{s=JSON.parse(localStorage.getItem('gc-cal')||'{}')}catch(e){}
 return {mode:s.mode||(innerWidth<700?'agenda':'month'),anchor:new Date().toISOString().slice(0,10),off:new Set(s.off||[]),mine:!!s.mine,sel:null}})();
const calSave=()=>{try{localStorage.setItem('gc-cal',JSON.stringify({mode:CAL.mode,off:[...CAL.off],mine:CAL.mine}))}catch(e){}};
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const monOf=s=>{const d=new Date(s+'T12:00:00');return addD(s,-((d.getDay()+6)%7))};
const eDay=e=>e.all_day?String(e.start).slice(0,10):ymd(new Date(e.start));
const eTime=e=>e.all_day?'':new Date(e.start).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
async function calView(){
 const a=CAL.anchor, first=a.slice(0,8)+'01';
 let from,to,title;
 if(CAL.mode==='month'){from=monOf(first);to=addD(from,41);title=new Date(first+'T12:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}

async function calMove(e,d){
 if(eDay(e)===d)return;
 const keepTime=s=>{const o=new Date(s);const n=new Date(d+'T00:00:00');n.setHours(o.getHours(),o.getMinutes(),0,0);return n.toISOString()};
 try{
  if(e.type==='task')await api('/api/tasks/'+e.id,{method:'PATCH',body:JSON.stringify({due_at:e.all_day?d+'T00:00:00Z':keepTime(e.start)})});
  else if(e.type==='deal')await api('/api/deals/'+e.id,{method:'PATCH',body:JSON.stringify({next_date:d})});
  else if(e.type==='campaign')await api('/api/campaigns/'+e.id+'/start',{method:'POST',body:JSON.stringify({at:keepTime(e.start)})});
  toast('Moved to '+new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}));badges();calView();
 }catch(err){toast(err.error==='bad_time'?'A campaign can only move to a future time':'Could not move it')}
}

   <button class="iconbtn" id="cal-dx" type="button" aria-label="Close">✕</button></div>
  <div class="cal-pop-b">${L.map(e=>`<button type="button" class="cal-row t-${e.type}${e.done?' done':''}" data-ck2="${esc(e.key)}"><i></i><span class="cal-rt">${eTime(e)||'All day'}</span><span class="cal-rb"><b>${esc(e.title)}</b><small>${esc(CALT[e.type][0])}${e.sub?' · '+esc(e.sub):''}</small></span></button>`).join('')}</div>

 document.body.append(scrim,pop);
 /* next to the day on a computer; a sheet from the bottom on a phone */
 if(innerWidth>=700&&anchor){const r=anchor.getBoundingClientRect(),w=Math.min(380,innerWidth-24);pop.style.width=w+'px';
  let x=r.right+10;if(x+w>innerWidth-12)x=r.left-w-10;if(x<12)x=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2));

 $('#cal-dx').onclick=calPopClose;scrim.onclick=calPopClose;

async function calOpen(e){

  if(L.kind==='task'){const t=(await api('/api/tasks?scope=all')).rows.find(x=>x.id===L.id);if(t){TASKCACHE[t.id]=t;taskForm(t)}else toast('That task is no longer there')}
  else if(L.kind==='deal')openDeal(L.id);

  else if(L.kind==='event'){const r=await api('/api/items/all');ALL_ITEMS=r.rows;const it=r.rows.find(x=>x.code===L.id);if(it){EV=JSON.parse(JSON.stringify(it));go('events')}}
  else if(L.kind==='campaign'){const r=await api('/api/campaigns');const c=r.rows.find(x=>x.id===L.id);if(c){CAM=JSON.parse(JSON.stringify(c));go('out')}}
  else if(L.kind==='regs')go('regs');

function drawImp(){

  <div class="card"><h3>For every row</h3><p class="note">Used where the file does not say. What the file says per person always wins.</p>
  <div class="f2"><div><label class="l">Where did this list come from? <span class="note">— required, shown in the footer of every email</span></label><input class="t" id="ip-src" placeholder="Ghana Chamber of Mines directory, September 2026"></div>

   <div><label class="l">Country</label><input class="t" id="ip-country" list="ip-cl" placeholder="As in the file"><datalist id="ip-cl">${['Ghana','Nigeria',"Côte d'Ivoire",'Togo','United Kingdom','United States','Denmark','Germany','France','Netherlands','China','United Arab Emirates','South Africa'].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
   <div><label class="l">Language</label><select class="t" id="ip-lang">${Object.entries(IMP_LANG).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></div></div>
  <h4 class="sec">Permission to contact</h4>
  <p class="note" style="margin-top:0">Tick only if these people actually agreed to hear from Gotham — they signed up, or asked to be kept informed. Yes/no columns in the file are used per person. A "no" already on record is never changed, and anyone who opted out is left alone.</p>
  <div class="ip-cons">${[['email','Email'],['sms','SMS'],['whatsapp','WhatsApp']].map(([k,l])=>`<label class="ip-ck"><input type="checkbox" id="ip-c-${k}"> They agreed to ${l}</label>`).join('')}</div>
  <div id="ip-how" hidden><label class="l">How did they agree? <span class="note">— required, kept with each contact</span></label><input class="t" id="ip-hows" placeholder="Signed up at the investor breakfast, 12 September 2026"></div>
  <div class="ip-go"><button class="btn btn-line" id="ip-check" type="button">Check first</button><button class="btn btn-dark" id="ip-run" type="button">Import ${sh.rows} rows</button></div>
  <div id="ip-res"></div></div>`;
 if($('#ip-sheet'))$('#ip-sheet').onchange=()=>{IMP.i=+$('#ip-sheet').value;drawImp()};
 document.querySelectorAll('.ip-map select').forEach(s=>s.onchange=()=>s.closest('tr').classList.toggle('hit',s.value!=='ignore'));
 const cons=()=>['email','sms','whatsapp'].filter(k=>$('#ip-c-'+k).checked);
 document.querySelectorAll('.ip-cons input').forEach(x=>x.onchange=()=>{$('#ip-how').hidden=!cons().length});
 const payload=dry=>{const mapping={};document.querySelectorAll('.ip-map select').forEach(s=>{if(s.value!=='ignore')mapping[s.dataset.col]=s.value});
  const b={...IMP.body,sheet:sh.name,mapping,dry,source:$('#ip-src').value.trim(),tags:$('#ip-tags').value,client_type:$('#ip-type').value,
   country:$('#ip-country').value.trim(),language:$('#ip-lang').value,consent_source:$('#ip-hows').value.trim()};
  cons().forEach(k=>b['consent_'+k]='yes');return {b,mapping}};
 const check=async dry=>{const {b,mapping}=payload(dry),v=Object.values(mapping);
  if(!b.source){$('#ip-src').focus();return toast(IMP_ERR.source_required)}
  if(cons().length&&!b.consent_source){$('#ip-hows').focus();return toast(IMP_ERR.consent_source_required)}
  if(!['company','full_name','first_name','last_name','email','phone','whatsapp'].some(f=>v.includes(f)))return toast('Point at least one column at Company, Person, Email or Phone');
  const btn=dry?$('#ip-check'):$('#ip-run');btn.disabled=true;const was=btn.textContent;btn.textContent=dry?'Checking…':'Importing…';

 $('#ip-check').onclick=()=>check(true);

}
function showRes(r,dry){
 const n=(x,t,cls)=>x?`<div class="ip-n ${cls||''}"><b>${x}</b><span>${t}</span></div>`:'';
 const yn=v=>v==='yes'?'✓':v==='no'?'✕':'–';
 const stats=`<div class="ip-stats">${n(r.added,dry?'new':'added','g')}${n(r.updated,dry?'already in your list — gaps filled, tags added':'updated')}${n(r.left_alone,'opted out — left alone','r')}${n(r.skipped,'skipped: no name, email or phone','r')}${n(r.email_unreadable,'emails we could not read — kept on the contact')}${n(r.consent_yes,'may be contacted')}</div>`;
 if(dry){document.querySelectorAll('#ip-steps li').forEach(l=>l.classList.add('on'));
  $('#ip-res').innerHTML=`<div class="ip-sum"><h4>If you import now</h4>${stats}
   ${r.sample&&r.sample.length?`<p class="note">How the first rows will look:</p><div class="wrapx"><table><thead><tr><th>Company</th><th>Person</th><th>Email</th><th>Phone</th><th>Type · country</th><th title="Email, SMS, WhatsApp">Email/SMS/WA</th></tr></thead><tbody>
   ${r.sample.map(s=>`<tr><td>${esc(s.company||'—')}</td><td>${esc(s.full_name||'')}<div class="note">${esc(s.role||'')}</div></td><td class="note">${esc(s.email||'—')}</td><td class="note">${esc(s.phone||'—')}</td><td class="note">${esc(CTYPE[s.client_type]||'—')}<div>${esc(s.country||'')}</div></td><td>${yn(s.consent.email)} ${yn(s.consent.sms)} ${yn(s.consent.whatsapp)}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`;
  $('#ip-res').scrollIntoView({behavior:'smooth',block:'nearest'});return}
 $('#ip-2').innerHTML=`<div class="card ip-done"><h3>Imported</h3>${stats}<p class="note">Saved from ${esc(IMP.label)}${r.sheet&&IMP.sheets.length>1?' / '+esc(r.sheet):''}. It is in the audit log. Import the same file again whenever it changes: people are matched by email, then phone, then company and name, so nothing is doubled.</p>
  <div class="ip-go"><button class="btn btn-dark" id="ip-see" type="button">See your clients</button><button class="btn btn-line" id="ip-more" type="button">Import another list</button><button class="btn btn-line" id="ip-out" type="button">Write to them</button></div></div>`;
 $('#ip-2').scrollIntoView({behavior:'smooth',block:'start'});
 $('#ip-see').onclick=()=>go('contacts');$('#ip-more').onclick=()=>importView();$('#ip-out').onclick=()=>go('out');

}

/* subscribers */
async function subs(){
 const d=await api('/api/subscribers');const R=d.rows;
 $('#scnt').textContent=R.length;
 const conf=R.filter(r=>r.confirmed_email&&r.marketing_opt_in).length, pend=R.filter(r=>!r.confirmed_email&&!r.unsubscribed_at).length, out=R.filter(r=>r.unsubscribed_at).length;
 const bySec={};R.filter(r=>r.confirmed_email&&r.marketing_opt_in).forEach(r=>{const k=r.sector||'Not stated';bySec[k]=(bySec[k]||0)+1});
 const secRows=Object.entries(bySec).sort((a,b)=>b[1]-a[1]);
 $('#view').innerHTML=`<div class="kpis">
  <div class="kpi"><b>${conf}</b><span>Confirmed and opted in</span></div>
  <div class="kpi"><b>${pend}</b><span>Waiting to confirm their email</span></div>
  <div class="kpi"><b>${out}</b><span>Unsubscribed</span></div>
  <div class="kpi"><b>${R.length}</b><span>Total sign-ups</span></div></div>
 <div class="card"><h3>By sector <span class="note">(confirmed only)</span></h3>
  ${secRows.map(([k,n])=>`<div class="ev"><div style="flex:1"><b>${esc(k)}</b><div class="note">${n}</div><div class="bar"><i style="width:${n/conf*100||0}%"></i></div></div></div>`).join('')||'<p class="note">No confirmed subscribers yet.</p>'}</div>
 <div class="card"><div class="filters">
   <input class="t" id="sq" placeholder="Search name, company, email">
   <select class="t" id="ss"><option value="">All sectors</option>${secRows.map(([k])=>`<option>${esc(k)}</option>`).join('')}</select>
   <select class="t" id="sf"><option value="">Everyone</option><option value="conf">Confirmed only</option><option value="pend">Not confirmed</option><option value="out">Unsubscribed</option></select>
   <button class="btn btn-line" id="copyPhones">Copy numbers for WhatsApp</button>
   <a class="btn btn-line" href="/api/export.csv">Export all CSV</a></div>
  <div class="wrapx"><table><thead><tr><th>Joined</th><th>Name</th><th>Company</th><th>Sector</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead><tbody id="stb"></tbody></table></div>
  <p class="note" id="ssum"></p></div>`;
 const draw=()=>{const q=($('#sq').value||'').toLowerCase(),sec=$('#ss').value,f=$('#sf').value;
  const rows=R.filter(r=>(!sec||(r.sector||'Not stated')===sec)
    &&(!f||(f==='conf'?(r.confirmed_email&&r.marketing_opt_in):f==='pend'?(!r.confirmed_email&&!r.unsubscribed_at):!!r.unsubscribed_at))
    &&(!q||[r.full_name,r.company,r.email,r.phone].join(' ').toLowerCase().includes(q)));
  $('#stb').innerHTML=rows.map(r=>`<tr><td class="note">${dt(r.created_at)}</td><td>${esc(r.full_name)}</td><td>${esc(r.company)}</td>
   <td>${esc(r.sector||'—')}<div class="note">${esc(r.utm_source||'')}</div></td><td class="note">${esc(r.email)}</td><td class="note">${esc(r.phone)}</td>
   <td>${r.unsubscribed_at?'<span class="tag t-canc">unsubscribed</span>':r.confirmed_email?'<span class="tag t-paid">confirmed</span>':'<span class="tag t-due">pending</span>'}</td></tr>`).join('')||'<tr><td colspan="7" class="note">Nobody matches.</td></tr>';
  $('#ssum').textContent=rows.length+' shown';
  $('#copyPhones').onclick=async()=>{const nums=rows.filter(r=>!r.unsubscribed_at).map(r=>r.phone).filter(Boolean).join(', ');
   try{await navigator.clipboard.writeText(nums);toast(rows.length+' numbers copied')}catch{toast('Copy failed')}};
 };
 ['#sq','#ss','#sf'].forEach(x=>{$(x).oninput=draw;$(x).onchange=draw});draw();
}

/* door check-in */
function door(){
 $('#view').innerHTML=`<div class="card"><h3>Check people in</h3>
  <p class="note">Scan the QR on the ticket, or type the ticket code or reference. Works on a phone: allow the camera when asked.</p>
  <div class="f2" style="margin-top:14px"><div><label class="l">Ticket code or reference</label>
   <div style="display:flex;gap:8px"><input class="t" id="ci" placeholder="GC1A2B3C4D or GC-F1-1234" autocapitalize="characters"><button class="btn btn-dark" id="cgo">Check in</button></div></div>
   <div><label class="l">Camera</label><button class="btn btn-line" id="cam">Start scanner</button><span class="note" id="camnote" style="margin-left:8px"></span></div></div>
  <video id="cv" playsinline style="display:none;width:100%;max-width:420px;border-radius:14px;margin-top:14px;background:#000"></video>
  <div id="cres" style="margin-top:16px"></div>
  <div class="log" id="clog"></div></div>`;
 const show=r=>{const box=$('#cres');
  const good=r.ok, colour=good?'var(--green-soft)':r.reason==='already'?'var(--gold-soft)':'var(--red-soft)';
  const label=good?'Checked in':r.reason==='already'?'Already checked in':r.reason==='not_confirmed'?'Not confirmed — do not admit yet':'Ticket not recognised';
  box.innerHTML=`<div style="background:${colour};border-radius:16px;padding:18px"><b style="font-size:20px">${label}</b>
   <div style="margin-top:6px">${esc(r.name||'')} ${r.company?'· '+esc(r.company):''}</div>
   ${r.seats?`<div class="note">${r.seats} seat(s) · ${esc(r.item||'')}</div>`:''}
   ${r.at?`<div class="note">first checked in ${dt(r.at)}</div>`:''}
   ${r.status?`<div class="note">status: ${esc(r.status)}</div>`:''}</div>`;
  const l=$('#clog');l.innerHTML=`<div>${new Date().toLocaleTimeString('en-GB')} · ${label} · ${esc(r.name||r.code||'')}</div>`+l.innerHTML;
 };
 const go=async code=>{if(!code)return;try{show(await api('/api/checkin',{method:'POST',body:JSON.stringify({code})}))}catch(e){toast('Could not reach the server')}};
 $('#cgo').onclick=()=>{go($('#ci').value.trim());$('#ci').value='';$('#ci').focus()};
 $('#ci').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#cgo').click()}};
 $('#cam').onclick=async()=>{
  if(!('BarcodeDetector' in window)){$('#camnote').textContent='This browser cannot scan. Use Chrome on Android, or type the code.';return}
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
   const v=$('#cv');v.style.display='block';v.srcObject=st;await v.play();
   const det=new BarcodeDetector({formats:['qr_code']});let last='',busy=false;
   const tick=async()=>{if(!v.isConnected)return;
    if(!busy){busy=true;try{const c=await det.detect(v);if(c[0]&&c[0].rawValue!==last){last=c[0].rawValue;await go(last);setTimeout(()=>last='',2500)}}catch{}busy=false}
    requestAnimationFrame(tick)};tick();$('#camnote').textContent='Scanning…';
  }catch{$('#camnote').textContent='Camera not allowed.'}};
}

async function mail(){

 $('#mcnt').textContent=R.filter(r=>r.status==='queued').length||'';
 $('#view').innerHTML=`${d.sending_enabled?'':'<div class="card" style="border-left:4px solid var(--gold)"><b>Automatic sending is off.</b> Add a Resend API key on the server and every message below goes out by itself. Until then the text is here to copy into your own email.</div>'}
 <div class="card"><div class="filters"><button class="btn btn-dark" id="flush">Send queued now</button>
  <span class="note">${R.filter(r=>r.status==='queued').length} queued · ${R.filter(r=>r.status==='sent').length} sent · ${R.filter(r=>r.status==='failed').length} failed</span></div>
  <div class="wrapx"><table><thead><tr><th>When</th><th>To</th><th>Subject</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody>
  ${R.map(r=>`<tr><td class="note">${dt(r.created_at)}</td><td>${esc(r.to_name||'')}<div class="note">${esc(r.to_email)}</div></td>
   <td>${esc(r.subject)}</td><td class="note">${esc(r.kind)}</td>
   <td>${r.status==='sent'?'<span class="tag t-paid">sent</span>':r.status==='failed'?'<span class="tag t-canc">failed</span>':r.status==='cancelled'?'<span class="tag t-free">cancelled</span>':'<span class="tag t-due">queued</span>'}${r.error?`<div class="note">${esc(String(r.error).slice(0,60))}</div>`:''}</td>
   <td><button class="btn btn-line" data-mail="${r.id}">View</button>${r.status==='queued'?`<button class="btn btn-line" data-done="${r.id}">Mark sent</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="note">Nothing yet.</td></tr>'}
  </tbody></table></div></div>`;
 $('#flush').onclick=async()=>{const r=await api('/api/outbox/flush',{method:'POST'});toast(r.sent?`${r.sent} sent`:`${r.held} waiting for a sending key`);mail()};
 document.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>{const m=R.find(x=>x.id==b.dataset.mail);
  $('#dr').classList.add('on');
  $('#drb').innerHTML=`<h2>${esc(m.subject)}</h2><p class="note">To ${esc(m.to_email)} · ${esc(m.kind)} · ${esc(m.status)}</p>
   <div class="acts"><button class="btn btn-line" id="cpy">Copy the text</button><a class="btn btn-line" href="mailto:${esc(m.to_email)}?subject=${encodeURIComponent(m.subject)}">Open in mail</a></div>
   <div style="border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px"><iframe style="width:100%;height:420px;border:0" srcdoc="${m.body.replace(/"/g,'&quot;')}"></iframe></div>`;
  $('#cpy').onclick=async()=>{const txt=m.body.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
   try{await navigator.clipboard.writeText(txt);toast('Copied')}catch{toast('Copy failed')}};});
 document.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{await api('/api/outbox/'+b.dataset.done+'/sent',{method:'POST'});toast('Marked sent');mail()});
}

  inv_vat_number:$('#is-vn').value,inv_terms_days:$('#is-td').value,inv_co_address:$('#is-ad').value,inv_bank:{bank_name:$('#bk-bn').value,swift:$('#bk-sw').value,branch:$('#bk-br').value,branch_code:$('#bk-bc').value,account_name:$('#bk-an').value,account_ghs:$('#bk-ag').value,bank_address:$('#bk-ad').value,charges:$('#bk-ch').value,
  fx:Object.fromEntries(['USD','EUR','GBP'].map(c=>[c,$('#bk-fx-'+c).value])),corr:[...document.querySelectorAll('#bk-corr .bk-c')].map(r=>Object.fromEntries([...r.querySelectorAll('[data-k]')].map(x=>[x.dataset.k,x.value])))},inv_footer:$('#is-ft').value,

  (e.fields||[]).forEach(f=>{const m=f.match(/^corr_(\d+)_(\w+)$/);const el=m?document.querySelector(`#bk-corr .bk-c[data-i="${m[1]}"] [data-k="${m[2]}"]`):$({swift:'#bk-sw',account_ghs:'#bk-ag',fx_USD:'#bk-fx-USD',fx_EUR:'#bk-fx-EUR',fx_GBP:'#bk-fx-GBP'}[f]||'#x-none');if(el)el.classList.add('bad')})}};

 const L=r.rows.filter(x=>x.contact_id===cid);
