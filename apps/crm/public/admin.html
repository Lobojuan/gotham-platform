/* phones: tables turn into cards, each value labelled with its column */
function labelTables(root){root.querySelectorAll('table').forEach(t=>{const h=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());if(!h.length)return;
 t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(td.dataset.l===undefined)td.dataset.l=h[i]||''}))})}
['#view','#drb'].forEach(s=>{let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;labelTables($(s))})}).observe($(s),{childList:true,subtree:true})});

/* session check */
api('/api/me').then(u=>{ME=u;start()}).catch(()=>{$('#login').style.display='grid'});
/* ===================== team chat (server side: chat.js) ===================== */
let CH={state:null,cur:null,msgs:[],last:0,timer:0,files:null};
const chName=c=>c.kind==='channel'?'#'+c.name:c.kind==='dm'?(()=>{const o=(c.members||[]).find(e=>e!==ME.email);const u=(CH.state.users||[]).find(x=>x.email===o);return u?(u.name||u.email):'Direct message'})():c.name;
const chWho=e=>e==='ai'?'Gotham AI':((CH.state&&CH.state.users||[]).find(x=>x.email===e)||{}).name||e;
const chText=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/(^|\s)@([\p{L}][\p{L}0-9.'-]{1,30})/gu,'$1<b class="mention">@$2</b>').replace(/\n/g,'<br>');
async function chatBadge(){
 const s=await api('/api/chat/state').catch(()=>null);if(!s)return;CH.state=s;
 ['#chcnt','#chcnt2'].forEach(x=>{const e=$(x);if(e){e.textContent=s.unread||'';e.classList.toggle('warn',s.mentioned>0)}});
 document.title=document.title.replace(/^\(\d+\) /,'');if(s.unread)document.title='('+s.unread+') '+document.title;
 if(V==='chat')chatList();
}
setInterval(()=>{if(ME&&!ME.must_change&&!document.hidden)chatBadge()},20000);
function chatList(){
 const s=CH.state,l=$('#chl');if(!s||!l)return;
 const row=c=>`<a class="chi ${CH.cur&&CH.cur.id===c.id?'on':''}" href="#chat/${c.id}"><span class="nm">${c.kind==='record'?`<span class="chip">${{contact:'Company',deal:'Deal',item:'Event'}[c.ref_type]}</span> `:''}${esc(chName(c))}</span>${c.unread?`<span class="b ${c.mentioned?'warn':''}">${c.unread}</span>`:''}</a>`;
 const g=k=>s.channels.filter(c=>c.kind===k);
 l.innerHTML=`<h6>Channels${isAdmin()?' <button type="button" class="lnk" id="ch-newc" title="New channel">+</button>':''}</h6>${g('channel').map(row).join('')}
  <h6>Direct messages <button type="button" class="lnk" id="ch-newd" title="New direct message">+</button></h6>${g('dm').map(row).join('')||'<p class="note">None yet.</p>'}
  <h6>Clients, deals & events</h6>${g('record').map(row).join('')||'<p class="note">Open a company, deal or event and press “Team chat”.</p>'}`;
 if($('#ch-newc'))$('#ch-newc').onclick=async()=>{const n=prompt('Name of the new channel (e.g. sponsors)');if(!n)return;try{const r=await api('/api/chat/channels',{method:'POST',body:JSON.stringify({name:n})});await chatBadge();go('chat',r.channel.id)}catch(e){toast('Could not add the channel')}};
 $('#ch-newd').onclick=()=>{const us=s.users.filter(u=>u.email!==ME.email);
  $('#dr').classList.add('on');$('#drb').innerHTML=`<h2 style="margin:0 0 12px">Message someone</h2><ul class="list">${us.map(u=>`<li class="li" style="cursor:pointer" data-dm="${esc(u.email)}"><span class="av">${initials(u.name||u.email)}</span><div class="grow"><b>${esc(u.name||u.email)}</b><div class="note">${esc(ROLE_NAME[u.role]||u.role)}</div></div></li>`).join('')}</ul>`;
  document.querySelectorAll('[data-dm]').forEach(x=>x.onclick=async()=>{const r=await api('/api/chat/dm',{method:'POST',body:JSON.stringify({email:x.dataset.dm})});closeDr();await chatBadge();go('chat',r.channel.id)})};
}
async function chatView(){
 clearInterval(CH.timer);
 $('#view').innerHTML=`<div class="chat"><nav class="chl" id="chl" aria-label="Conversations"></nav><section class="chm" id="chm"><div class="empty">Choose a conversation.</div></section></div>`;
 await chatBadge();
 let id=+ARG||0;
 if(!id&&CH.state){const g=CH.state.channels.find(c=>c.name==='general');id=g?g.id:0}
 if(id)chatOpen(id);else chatList();
}
async function chatOpen(id){
 clearInterval(CH.timer);
 let r;try{r=await api('/api/chat/messages?channel='+id)}catch(e){$('#chm').innerHTML='<div class="empty"><b>Not available.</b>This conversation is closed to you or no longer exists.</div>';return}
 if(V!=='chat')return;
 CH.cur=r.channel;CH.msgs=r.messages;CH.last=CH.msgs.length?CH.msgs[CH.msgs.length-1].id:0;
 const known=(CH.state.channels||[]).find(c=>c.id===id)||{...r.channel,members:[]};
 const link=r.channel.kind==='record'?({contact:`#rec/${r.channel.ref_id}`,deal:null,item:'#events'})[r.channel.ref_type]:null;
 setTitle('Team chat',chName(known));
 $('#chm').innerHTML=`<div class="chh"><div><b>${esc(chName(known))}</b>${r.channel.topic?`<div class="note">${esc(r.channel.topic)}</div>`:''}</div>
   ${link?`<a class="btn btn-line" href="${link}">Open ${r.channel.ref_type==='item'?'events':'record'}</a>`:r.channel.ref_type==='deal'?`<button class="btn btn-line" id="ch-deal">Open deal</button>`:''}</div>
  <div class="chs" id="chs" aria-live="polite"></div>
  <form class="chc" id="chc"><div class="chat-mn" id="chmn" hidden></div><div class="chf" id="chfp" hidden></div>
   <textarea id="cht" rows="2" placeholder="Write a message. @name to mention someone, @all for everyone here." aria-label="Message"></textarea>
   <div class="cbar"><label class="btn btn-line" title="Add a photo or file">Attach<input type="file" id="chfile" hidden accept="image/*,.pdf,.docx,.xlsx,.pptx,.txt,.csv"></label><span class="note">Enter to send · Shift+Enter for a new line</span><button class="btn btn-dark">Send</button></div></form>`;
 if($('#ch-deal'))$('#ch-deal').onclick=()=>openDeal(+r.channel.ref_id);
 chatDraw(true);chatList();chatRead();
 const t=$('#cht');
 t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!$('#chmn').hidden&&$('#chmn').firstChild){e.preventDefault();$('#chmn').firstChild.click();return}
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#chc').requestSubmit()}});
 t.addEventListener('input',()=>{const m=t.value.slice(0,t.selectionStart).match(/@([\p{L}]*)$/u),box=$('#chmn');
  if(!m){box.hidden=true;return}const qq=m[1].toLowerCase();
  const opts=[...CH.state.users.filter(u=>u.email!==ME.email).map(u=>first(u.name||u.email)),'all',...(CH.state.ai?['Gotham']:[])].filter(n=>n.toLowerCase().startsWith(qq)).slice(0,6);
  box.innerHTML=opts.map(n=>`<button type="button" data-n="${esc(n)}">@${esc(n)}</button>`).join('');box.hidden=!opts.length;
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const pos=t.selectionStart,before=t.value.slice(0,pos).replace(/@[\p{L}]*$/u,'@'+b.dataset.n+' ');t.value=before+t.value.slice(pos);box.hidden=true;t.focus();t.selectionStart=t.selectionEnd=before.length})});
 $('#chfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>10*1024*1024)return toast('Files up to 10 MB');
  $('#chfp').hidden=false;$('#chfp').textContent='Uploading '+f.name+'…';
  const data=await new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.readAsDataURL(f)});
  try{const u=await api('/api/chat/upload',{method:'POST',body:JSON.stringify({name:f.name,type:f.type||'application/octet-stream',data})});CH.files={id:u.file,name:f.name};$('#chfp').innerHTML=`📎 ${esc(f.name)} <button type="button" class="lnk" id="chfx">remove</button>`;$('#chfx').onclick=()=>{CH.files=null;$('#chfp').hidden=true}}
  catch(err){$('#chfp').hidden=true;toast(err.message==='file_type'?'That kind of file cannot be shared here':'Upload failed')}};
 $('#chc').onsubmit=async e=>{e.preventDefault();const body=t.value.trim();if(!body&&!CH.files)return t.focus();
  const b=$('#chc button.btn-dark');b.disabled=true;
  try{const r=await api('/api/chat/messages',{method:'POST',body:JSON.stringify({channel:CH.cur.id,body,file:CH.files&&CH.files.id})});t.value='';CH.files=null;$('#chfp').hidden=true;
   if(!CH.msgs.some(m=>m.id===r.message.id))CH.msgs.push(r.message);CH.last=Math.max(CH.last,r.message.id);chatDraw(true);chatRead()}
  catch(err){toast('Not sent. Try again.')}finally{b.disabled=false;t.focus()}};
 CH.timer=setInterval(chatPoll,4000);
 t.focus();
}
async function chatPoll(){
 if(V!=='chat'||!CH.cur){clearInterval(CH.timer);return}if(document.hidden)return;
 const r=await api('/api/chat/messages?channel='+CH.cur.id+'&after='+CH.last).catch(()=>null);if(!r||!r.messages.length)return;
 const s=$('#chs'),atEnd=s&&s.scrollHeight-s.scrollTop-s.clientHeight<80;
 for(const m of r.messages)if(!CH.msgs.some(x=>x.id===m.id))CH.msgs.push(m);
 CH.last=CH.msgs[CH.msgs.length-1].id;chatDraw(atEnd);chatRead();
}
async function chatRead(){if(!CH.cur||!CH.last)return;await api('/api/chat/read',{method:'POST',body:JSON.stringify({channel:CH.cur.id,last:CH.last})}).catch(()=>{});chatBadge()}
function chatDraw(toEnd){
 const s=$('#chs');if(!s)return;let prevDay='';
 s.innerHTML=CH.msgs.length?CH.msgs.map(m=>{
  const day=new Date(m.at).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}),sep=day!==prevDay?`<div class="chday"><span>${day}</span></div>`:'';prevDay=day;
  const time=new Date(m.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),who=m.author_name||chWho(m.author),mine=m.author===ME.email;
  if(m.deleted)return sep+`<div class="chmsg del"><div class="chb"><span class="note">Message deleted</span></div></div>`;
  if(m.kind==='system')return sep+`<div class="chsys">${esc(m.body)} · ${time}</div>`;
  if(m.kind==='proposal'){const d=m.data||{},st=d.status;
   return sep+`<div class="chmsg prop"><span class="av ai">✦</span><div class="chb"><div class="chw"><b>Gotham AI</b> <span class="note">${time}</span></div>
    <div class="chp"><b>Website update for ${esc(d.title||d.code)}</b><ul>${(d.updates||[]).map(u=>`<li>${esc(u.type==='add_speaker'?'Add speaker: '+u.name+(u.role?' ('+u.role+')':''):u.type==='remove_speaker'?'Remove speaker: '+u.name:u.type==='agenda_add'?'Programme: '+(u.time?u.time+' ':'')+u.what:u.type==='set_venue'?'Venue: '+u.venue:u.type==='set_start'?'New date: '+u.date+' '+u.time:'News: '+u.text)}</li>`).join('')}</ul>
    ${st==='pending'?(isAdmin()?`<div class="acts"><button class="btn btn-dark" data-pub="${m.id}">Publish to website</button><button class="btn btn-line" data-dis="${m.id}">Dismiss</button></div><div class="note">Nothing changes on the website until you publish.</div>`:'<div class="note">Waiting for an admin to publish.</div>')
     :`<div class="note">${st==='published'?'Published':'Dismissed'} by ${esc(chWho(d.by))}${d.at?' · '+dshort(d.at):''}</div>`}</div></div></div>`}
  const f=m.file?(m.file.kind==='image'?`<a href="/api/chat/files/${m.file.id}" target="_blank" rel="noopener"><img class="chimg" src="/api/chat/files/${m.file.id}?thumb=1" alt="${esc(m.file.name||'Photo')}" loading="lazy"></a>`
   :`<a class="chfile" href="/api/chat/files/${m.file.id}">📎 ${esc(m.file.name||'File')}</a>`):'';
  return sep+`<div class="chmsg ${mine?'me':''} ${m.mentions.includes(ME.email)?'at':''}"><span class="av">${initials(who)}</span><div class="chb"><div class="chw"><b>${esc(who)}</b> <span class="note">${time}</span>${mine||ME.role==='owner'?` <button type="button" class="lnk chdel" data-del="${m.id}" title="Delete">Delete</button>`:''}</div>${m.body?`<div class="cht">${chText(m.body)}</div>`:''}${f}</div></div>`}).join(''):'<div class="empty">No messages yet. Say hello.</div>';
 if(toEnd)s.scrollTop=s.scrollHeight;
 s.querySelectorAll('[data-pub],[data-dis]').forEach(b=>b.onclick=async()=>{const pub=!!b.dataset.pub;if(pub&&!confirm('Publish this update to the website now?'))return;
  try{await api('/api/chat/proposal',{method:'POST',body:JSON.stringify({id:+(b.dataset.pub||b.dataset.dis),decision:pub?'publish':'dismiss'})});toast(pub?'Published to the website':'Dismissed');chatOpen(CH.cur.id)}catch(e){toast('Could not do that: '+e.message)}});
 s.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this message?'))return;await api('/api/chat/messages/'+b.dataset.del,{method:'DELETE'}).catch(()=>{});chatOpen(CH.cur.id)});
}

 try{const r=await api('/api/chat/thread',{method:'POST',body:JSON.stringify({ref_type,ref_id})});closeDr();go('chat',r.channel.id)}catch(e){toast('Could not open the team chat')}
}
