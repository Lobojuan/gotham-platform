# Uptime check from outside our server, every 30 minutes (about 1,500 of the 2,000 free GitHub Actions minutes a month).
# When a check fails, GitHub emails the repository owner. The workflow can also be run by hand (Actions → Uptime → Run workflow).
name: Uptime
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Website, back office and database answer
        run: |
          set -u
          fail=0
          check() {  # url  text-that-must-appear
            for i in 1 2 3; do
              body=$(curl -fsS -m 25 -A 'GothamUptime/1.0' "$1") && echo "$body" | grep -q "$2" && { echo "OK   $1"; return 0; }
              sleep 20
            done
            echo "DOWN $1"; fail=1
          }
          check https://gothamconsult.com/ 'Gotham Consult'
          check https://gothamconsult.com/api/health '"database":"ok"'
          check https://gothamconsult.com/admin 'Gotham CRM'
          check https://gotham.84-12-73-59.sslip.io/api/health '"database":"ok"'
          exit $fail
